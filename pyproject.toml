[project]
name = "serviceflow-ai"
version = "1.1.0"
description = "Enterprise ticket triage and grounded knowledge-base assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "langgraph>=0.6,<2.0",
    "python-multipart>=0.0.18,<1.0",
    "uvicorn>=0.30,<1.0",
]

[project.scripts]
serviceflow = "serviceflow.cli:main"

[tool.setuptools]
packages = ["serviceflow"]

